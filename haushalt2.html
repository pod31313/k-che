<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<title>Haushalt</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --purple:#AF52DE;
  --gray:#8E8E93; --gray-light:#F2F2F7; --gray-mid:#E5E5EA;
  --text:#1C1C1E; --text-2:#8E8E93; --bg:#F2F2F7; --card:#FFFFFF; --border:#E5E5EA;
  --r:12px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --c-anton:#007AFF; --c-friedrich:#FF9500; --c-justus:#AF52DE;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}

/* Topbar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:calc(var(--safe-t) + 10px) 16px 10px}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:1.05rem;font-weight:700}
.topbar .date{font-size:.78rem;color:var(--text-2);margin-top:1px}
.seg{display:flex;background:var(--gray-light);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600;color:var(--gray);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.person button{padding:7px 18px;font-weight:800;font-size:.95rem}
.person.need{animation:pulse 1s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 4px #FF3B3055}}

.content{padding:10px 14px calc(70px + var(--safe-b))}
.listseg{margin:0 0 6px}
.listseg button.on.haushalt{color:var(--blue)} .listseg button.on.kinder{color:var(--green)} .listseg button.on.abend{color:var(--purple)}

.label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);padding:14px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.progress{padding:8px 4px 2px;font-size:.8rem;color:var(--text-2)}
.progress strong{color:var(--text)}
.pbar{height:6px;background:var(--gray-mid);border-radius:99px;overflow:hidden;margin:6px 4px 0}
.pbar>div{height:100%;border-radius:99px;transition:width .3s}

/* Task rows (Eltern-Listen) */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);min-height:52px;cursor:pointer;user-select:none}
.row:last-child{border-bottom:none}
.row:active{background:var(--gray-light)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--gray-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff;font-weight:700}
.row.done .chk{background:var(--green);border-color:var(--green)}
.row.skip .chk{background:#007AFF18;border-color:#007AFF88;color:var(--blue)}
.row .txt{flex:1;font-size:.95rem;line-height:1.3}
.row.done .txt,.row.skip .txt{color:var(--text-2)}
.badge{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--gray-light);color:var(--text-2)}
.badge.E{background:#007AFF18;color:var(--blue)} .badge.B{background:#34C75918;color:var(--green)}

/* Handy-Check */
.hc{padding:12px 14px}
.hc-q{font-size:.95rem;font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--border);border-radius:99px;padding:7px 12px 7px 8px;background:var(--card);cursor:pointer;font-size:.88rem;font-weight:600;user-select:none}
.chip .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--gray-mid);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff}
.chip.done{border-color:var(--green)} .chip.done .dot{background:var(--green);border-color:var(--green)}
.chip.skip{color:var(--text-2)} .chip.skip .dot{border-color:#007AFF88;color:var(--blue)}

/* Wochenstatus */
.ws{padding:12px 14px;border-bottom:1px solid var(--border)}
.ws:last-child{border-bottom:none}
.ws-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ws-title{font-weight:600;font-size:.95rem}
.ws-sub{font-size:.78rem;color:var(--text-2);margin-top:2px}
.pills{display:flex;gap:4px;background:var(--gray-light);border-radius:9px;padding:3px}
.pills button{border:none;background:transparent;border-radius:7px;padding:6px 10px;font-size:.8rem;font-weight:600;color:var(--gray);cursor:pointer}
.pills button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pills button.on.good{color:var(--green)} .pills button.on.bad{color:var(--red)} .pills button.on.warn{color:var(--orange)}
.ws-extra{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.inp{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:.9rem;background:var(--card)}
.inp:focus{outline:2px solid #007AFF55;border-color:var(--blue)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--gray-light);border-radius:99px;padding:4px 10px;font-size:.8rem}
.btn{border:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:.85rem;cursor:pointer;background:var(--gray-light)}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.small{padding:5px 10px;font-size:.75rem}
.due{color:var(--orange);font-weight:700}
.overdue{color:var(--red);font-weight:700}

/* Kinder (Eltern-Ansicht) */
.kidpick{display:none;margin:4px 0 2px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kcol{background:var(--card);border-radius:var(--r);overflow:hidden}
.khead{padding:9px 10px 8px;border-bottom:2px solid;display:flex;align-items:center;justify-content:space-between;gap:6px}
.kname{font-weight:700;font-size:.88rem}
.kcount{font-size:.72rem;color:var(--text-2);font-weight:500;margin-left:4px}
.krow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);min-height:44px}
.krow:last-child{border-bottom:none}
.kmark{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--gray-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#fff;font-weight:800}
.kmark.on{background:#34C75999;border-color:transparent}
.ktxt{flex:1;font-size:.83rem;line-height:1.3}
.ksub{display:block;font-size:.68rem;font-weight:600;color:var(--orange);margin-top:1px}
.pmark{width:30px;height:30px;border-radius:50%;border:2px solid var(--gray-mid);background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;cursor:pointer;color:#fff}
.pmark.done{background:var(--green);border-color:var(--green)}
.pmark.fail{background:var(--red);border-color:var(--red)}
.pmark.skip{background:#007AFF18;border-color:#007AFF88;color:var(--blue)}
.krow.pending{background:#34C7590d}
.krow.pending .pmark{border-color:var(--green);border-style:dashed}
.krow.fail{background:#FF3B300f} .krow.fail .ktxt{color:var(--red)}
.krow.ok .ktxt,.krow.skip .ktxt{color:var(--text-2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.72rem;color:var(--text-2);padding:6px 4px 0;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:13px;height:13px;border-radius:50%;display:inline-block;border:1.5px solid var(--gray-mid)}

/* Woche */
.lnk{border:none;background:none;color:var(--blue);font-weight:600;font-size:.8rem;cursor:pointer;padding:2px 4px}
.logline{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.loglist{margin-top:4px}
.logitem{font-size:.82rem;padding:6px 0;border-top:1px solid var(--border)}
.logitem:first-child{border-top:none}
.ws.due-hl{background:#FF95000f;box-shadow:inset 4px 0 0 var(--orange)}
.ws.late-hl{background:#FF3B300b;box-shadow:inset 4px 0 0 var(--red)}
.dot-red{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);vertical-align:middle}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;margin:8px 0 2px;border-radius:10px;background:var(--card)}
.daynav .t{font-weight:700;font-size:.92rem;text-align:center}
.mt-item{padding:12px 14px;margin-bottom:8px}
.mt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:.9rem}
.mt-text{white-space:pre-wrap;font-size:.9rem;line-height:1.45}
textarea.inp{resize:vertical;font-family:inherit;line-height:1.4}
.daynav.future{background:#007AFF12;outline:1.5px solid #007AFF55}
.daynav.future .hint{color:var(--blue)}
.kid-big.sonder{outline:2px solid #FF950088}
.daynav.past{background:#FF95001f;outline:1.5px solid #FF950066}
.daynav .hint{font-weight:500;color:var(--orange);font-size:.8rem}
.btn:disabled{opacity:.35;cursor:default}
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
.wk-nav .t{font-weight:700;font-size:.92rem}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.wk{width:100%;border-collapse:collapse;min-width:560px}
table.wk th{font-size:.7rem;color:var(--text-2);font-weight:600;padding:8px 2px;text-align:center}
table.wk th.today{color:var(--blue)}
table.wk td{border-top:1px solid var(--border);padding:6px 2px;text-align:center;font-size:.8rem}
table.wk td.name{text-align:left;padding-left:12px;font-size:.84rem;min-width:150px}
table.wk tr.sec td{background:var(--gray-light);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);text-align:left;padding:5px 12px}
.c{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;background:var(--gray-light);color:var(--text-2)}
.c.E{background:#007AFF22;color:var(--blue)} .c.B{background:#34C75922;color:#1f9d45}
.c.ok{background:var(--green);color:#fff} .c.kid{background:#34C75933;color:#1f9d45}
.c.fail{background:var(--red);color:#fff} .c.skip{background:transparent;color:var(--blue)}
.c.na{background:transparent;color:var(--gray-mid)} .c.fut{background:transparent;border:1.5px dashed var(--gray-mid)}
.wsum{padding:10px 14px;font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px 18px}
.wsum b{font-weight:600}

/* Einkauf */
.cat{padding:2px 0 4px}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.92rem;user-select:none}
.item .q{font-size:.72rem;color:var(--text-2);background:var(--gray-light);border-radius:6px;padding:2px 6px}
.item.bought{opacity:.45;text-decoration:line-through}
.addform{display:grid;grid-template-columns:80px 1fr;gap:8px}
.addform .full{grid-column:1/-1}
.addrow{display:flex;gap:8px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 0 calc(6px + var(--safe-b))}
.nav .wrap{display:flex}
.nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--gray);cursor:pointer;padding:4px}
.nav button .i{font-size:1.35rem;line-height:1}
.nav button.on{color:var(--blue)}

.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%);background:#1C1C1Ee6;color:#fff;padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.err{background:#FF3B3015;color:var(--red);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:8px 0}
.empty{padding:14px;color:var(--text-2);font-size:.85rem;text-align:center}

/* Kind-Modus */
body.kidmode .content{padding-bottom:calc(70px + var(--safe-b))}
.kid-big .krow{padding:12px 14px;min-height:56px;cursor:pointer;user-select:none}
.kid-big .krow:active{background:var(--gray-light)}
.kid-big .kmark{width:28px;height:28px;border-radius:8px;font-size:.95rem;border-width:2px}
.kid-big .kmark.on{background:var(--kc);border-color:var(--kc)}
.kid-big .ktxt{font-size:1rem}
.kid-big .krow.mine .ktxt{color:var(--text-2);text-decoration:line-through}
.vbadge{font-size:.68rem;font-weight:700;border-radius:99px;padding:3px 8px}
.vbadge.done{background:#34C75922;color:#1f9d45} .vbadge.fail{background:#FF3B3022;color:var(--red)} .vbadge.skip{background:#007AFF18;color:var(--blue)}

@media (max-width:819px){
  .kidpick{display:flex}
  .kgrid{grid-template-columns:1fr}
  .kgrid .kcol:not(.sel){display:none}
  .topbar h1{font-size:1rem}
  .seg button{padding:8px 8px}
}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <div><h1 id="title">🏠 Haushalt</h1><div class="date" id="dateline"></div></div>
  <div class="seg person" id="person"></div>
</div></div>
<div class="content"><div class="wrap" id="main"><div class="empty">Lade …</div></div></div>
<nav class="nav" id="nav"><div class="wrap">
  <button data-view="heute"><span class="i">✅</span>Heute</button>
  <button data-view="woche"><span class="i">📅</span>Woche</button>
  <button data-view="treffen"><span class="i">🗒️</span>Treffen</button>
  <button data-view="einkauf"><span class="i">🛒</span>Einkauf</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
// ═══ Konfiguration ═══════════════════════════════════════════════
const SB_URL='https://ainggprkypgbghqxowpy.supabase.co';
const SB_KEY='sb_publishable_kcGLDokPdR1CNS2X9npHDA_qeWu6URm';
const db=(window.__MOCK_DB__)||supabase.createClient(SB_URL,SB_KEY);

const KIDS=['Anton','Friedrich','Justus'];
const KCOL={Anton:'var(--c-anton)',Friedrich:'var(--c-friedrich)',Justus:'var(--c-justus)'};
const KHEX={Anton:'#007AFF',Friedrich:'#FF9500',Justus:'#AF52DE'};
const SECTIONS=[['morgen','Morgen'],['nachmittag','Nachmittag'],['abend','Abend']];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const CATS=['Lebensmittel','Haushalt','Drogerie','Apotheke','Sonstiges'];

// ═══ Datum ═══════════════════════════════════════════════════════
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const today=()=>window.__TODAY__||ymd(new Date());
const dm=s=>{const d=parse(s);return `${d.getDate()}.${d.getMonth()+1}.`};
const dow=s=>parse(s).getDay();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ═══ Zustand ═════════════════════════════════════════════════════
const qs=new URLSearchParams(location.search);
const KID=(()=>{const k=(qs.get('kind')||'').toLowerCase();return KIDS.find(x=>x.toLowerCase()===k)||null})();
const S={
  user:localStorage.getItem('hh_user')||'',
  view:'heute', list:localStorage.getItem('hh_list')||'haushalt',
  day:today(), log:[], logOpen:null, logExp:{}, oForm:{kid:null,date:'',section:'nachmittag'},
  wkStart:monday(today()), wkList:'haushalt', wkKid:'Anton',
  mKid:localStorage.getItem('hh_mkid')||'Anton',
  tasks:[], comp:new Map(), kid:new Map(), weekly:new Map(), shop:[],
  err:null, loaded:false
};
const cur=()=>KID?today():S.day;
const MAXBACK=7;
const sid=x=>String(x);
const ck=(t,d)=>`${sid(t)}|${d}`;
const kk=(t,d,c)=>`${sid(t)}|${d}|${c||''}`;
const comp=(t,d)=>S.comp.get(ck(t,d));
const kidc=(t,d,c)=>S.kid.get(kk(t,d,c));

// ═══ Aufgaben-Logik ══════════════════════════════════════════════
function taskDays(t){ if(Array.isArray(t.days)&&t.days.length) return t.days;
  if(t.day_of_week!==null&&t.day_of_week!==undefined) return [t.day_of_week]; return null; }
function doneOn(t,x){ const s=kstate(t,x,t.child_name); return s.eff===true||s.p==='skip'; }
const onDay=(t,d)=>{
  // Sonderaufgabe: ab Datum täglich, bis erledigt (oder „nicht nötig“)
  if(t.kind==='once'){ if(!t.next_due_date||d<t.next_due_date) return false;
    for(let x=t.next_due_date;x<d;x=addDays(x,1)) if(doneOn(t,x)) return false; return true; }
  const x=taskDays(t); if(!x||x.includes(dow(d))) return true;
  // Übertrag (z. B. Zeitungen Fr → Sa): an den Folgetagen, solange nicht erledigt
  if(t.kind==='carry'){ const n=t.recurrence_days||1;
    for(let i=1;i<=n;i++){ if(x.includes(dow(addDays(d,-i)))){
      for(let j=i;j>=1;j--) if(doneOn(t,addDays(d,-j))) return false; return true; } } }
  return false; };
const KSECTIONS=[['sonder','⭐ Sonderaufgaben'],...SECTIONS];
const MAXFWD=7;
function kidSub(t,d,child,kid){
  if(t.kind==='weekly') return `<span class="ksub">${weekCount(t,d,child)}/${t.weekly_target||1} diese Woche</span>`;
  if(t.kind==='rotation') return `<span class="ksub">${kid?'du bist dran':'diesmal dran'}</span>`;
  if(t.kind==='once') return `<span class="ksub">${t.next_due_date<d?'offen seit '+WD[dow(t.next_due_date)]+' '+dm(t.next_due_date):'einmalig'}</span>`;
  const x=taskDays(t);
  if(t.kind==='carry'&&x&&!x.includes(dow(d))) return `<span class="ksub" style="color:var(--red)">von ${x.map(v=>WD[v]).join('/')} – noch offen</span>`;
  if(!kid&&x&&x.length<3) return `<span class="ksub">${x.map(v=>WD[v]).join(', ')}</span>`;
  return '';
}
const byList=l=>S.tasks.filter(t=>t.list_name===l).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));

// Kinderaufgabe: Kind-Haken k, Eltern-Status p, effektiv erledigt eff
function kstate(t,d,child){
  const c=comp(t.id,d); const p=c?c.status:null;
  const k=!!kidc(t.id,d,child);
  const eff=p==='done'?true:p==='fail'?false:p==='skip'?null:k;
  const cls=p==='fail'?'fail':p==='done'?'ok':p==='skip'?'skip':k?'pending':'open';
  return {k,p,eff,cls};
}
// Rotation (Altglas): zuständig ist, wer es zuletzt NICHT tatsächlich erledigt hat
function rotDoer(t,d){
  const c=comp(t.id,d); const p=c?c.status:null;
  if(p==='fail'||p==='skip') return null;
  const kids=(t.rotation||[]).filter(x=>kidc(t.id,d,x));
  if(p==='done') return c.child_name||kids[0]||rotAssignee(t,d);
  return kids[0]||null;
}
function rotAssignee(t,d){
  const rot=(t.rotation&&t.rotation.length)?t.rotation:['Justus','Friedrich'];
  const dates=new Set();
  for(const c of S.comp.values()) if(sid(c.task_id)===sid(t.id)&&c.date<d) dates.add(c.date);
  for(const k of S.kid.values()) if(sid(k.task_id)===sid(t.id)&&k.date<d) dates.add(k.date);
  const sorted=[...dates].sort().reverse();
  for(const x of sorted){ const who=rotDoer(t,x); if(who) return rot.find(r=>r!==who)||rot[0]; }
  return rot[0];
}
// Aufgaben eines Kindes an einem Tag (inkl. Rotation, falls zuständig)
function kidTasks(child,d,section){
  return byList('kinder2').filter(t=>(section==='sonder'?t.kind==='once':(t.kind!=='once'&&t.section===section))&&onDay(t,d)&&(
    t.kind==='rotation'?rotAssignee(t,d)===child:t.child_name===child));
}
function weekCount(t,d,child){
  const m=monday(d); let n=0;
  for(let i=0;i<7;i++){const x=addDays(m,i); if(x>today()) break; if(kstate(t,x,child).eff===true) n++;}
  return n;
}
function intervalInfo(t){
  let last=null;
  for(const c of S.comp.values()) if(sid(c.task_id)===sid(t.id)&&c.status==='done'&&c.date<=today()&&(!last||c.date>last)) last=c.date;
  const due=last?addDays(last,t.recurrence_days||14):(t.next_due_date||today());
  return {last,due};
}

// ═══ Laden ═══════════════════════════════════════════════════════
async function q(p){const r=await p; if(r.error) throw r.error; return r.data||[];}
async function load(){
  try{
    const t0=today(); const from=[monday(addDays(t0,-MAXBACK)),S.wkStart].sort()[0]; const to=addDays([monday(t0),S.wkStart].sort()[1],6);
    S.tasks=await q(db.from('tasks').select('*').eq('active',true));
    const histIds=S.tasks.filter(t=>['rotation','interval','once'].includes(t.kind)).map(t=>t.id);
    const [c1,k1,c2,k2,ws,lg]=await Promise.all([
      q(db.from('completions').select('*').gte('date',from).lte('date',to)),
      q(db.from('child_completions').select('*').gte('date',from).lte('date',to)),
      histIds.length?q(db.from('completions').select('*').in('task_id',histIds)):[],
      histIds.length?q(db.from('child_completions').select('*').in('task_id',histIds)):[],
      KID?[]:q(db.from('weekly_status').select('*').in('week_start',[monday(t0),monday(addDays(t0,-MAXBACK)),S.wkStart])),
      KID?[]:q(db.from('log_entries').select('*').order('date',{ascending:false}).limit(400)).catch(e=>{console.warn('Logbuch:',e);return [];})
    ]);
    S.log=lg;
    S.comp=new Map(); for(const c of [...c1,...c2]) S.comp.set(ck(c.task_id,c.date),c);
    S.kid=new Map(); for(const k of [...k1,...k2]) S.kid.set(kk(k.task_id,k.date,k.child_name),k);
    S.weekly=new Map(); for(const w of ws) S.weekly.set(`${w.week_start}|${w.key}`,w);
    S.shop=await q(db.from('shopping_items').select('*').order('created_at'));
    S.err=null; S.loaded=true;
  }catch(e){ console.error(e); S.err=e.message||String(e); }
  render();
}

// ═══ Schreiben ═══════════════════════════════════════════════════
function needUser(){ if(S.user) return false;
  toast('Bitte oben zuerst E oder B wählen'); const p=document.getElementById('person'); p.classList.remove('need'); void p.offsetWidth; p.classList.add('need'); return true; }
async function setComp(taskId,d,status,extra={}){
  const key=ck(taskId,d); const prev=S.comp.get(key);
  try{
    if(!status){ S.comp.delete(key); render();
      const r=await db.from('completions').delete().eq('task_id',taskId).eq('date',d); if(r.error) throw r.error; return; }
    const row={task_id:taskId,date:d,status,done_by:S.user||'?',reason:null,child_name:extra.child_name??null};
    S.comp.set(key,{...(prev||{}),...row}); render();
    // löschen + neu anlegen statt upsert: die RLS-Regeln erlauben kein UPDATE auf completions
    { const d1=await db.from('completions').delete().eq('task_id',taskId).eq('date',d); if(d1.error) throw d1.error; }
    const r=await db.from('completions').insert(row).select().single();
    if(r.error) throw r.error; S.comp.set(key,r.data);
  }catch(e){ if(prev) S.comp.set(key,prev); else S.comp.delete(key); fail(e); }
}
const CYCLE3={null:'done',done:'skip',skip:null,fail:null};
function cycleTask(id){ if(needUser()) return; const c=comp(id,cur()); setComp(id,cur(),CYCLE3[c?c.status:null]); }
function cycleVerify(id,child){ if(needUser()) return; if(cur()>today()) return toast('Vorschau – abhaken erst am Tag selbst');
  const t=S.tasks.find(x=>sid(x.id)===id); const d=cur(); const c=comp(id,d);
  const next={null:'done',done:'fail',fail:'skip',skip:null}[c?c.status:null];
  setComp(id,d,next,{child_name:t&&t.kind==='rotation'?child:null}); }
async function verifyAll(child,section){ if(needUser()) return;
  const d=cur(); const list=kidTasks(child,d,section).filter(t=>kstate(t,d,child).cls==='pending');
  for(const t of list) await setComp(t.id,d,'done',{child_name:t.kind==='rotation'?child:null}); }
async function toggleKid(id,child){
  const d=cur(); const key=kk(id,d,child); const ex=S.kid.get(key);
  try{
    if(ex){ S.kid.delete(key); render(); const r=await db.from('child_completions').delete().eq('task_id',id).eq('date',d).eq('child_name',child); if(r.error) throw r.error; }
    else{ const row={task_id:id,date:d,child_name:child}; S.kid.set(key,row); render();
      const r=await db.from('child_completions').insert(row).select().single(); if(r.error) throw r.error; S.kid.set(key,r.data); }
  }catch(e){ if(ex) S.kid.set(key,ex); else S.kid.delete(key); fail(e); }
}
async function setWeekly(key,patch){ if(needUser()) return;
  const wk=monday(cur()); const mk=`${wk}|${key}`; const prev=S.weekly.get(mk);
  const row={...(prev||{}),week_start:wk,key,...patch,updated_by:S.user,updated_at:new Date().toISOString()}; delete row.id;
  S.weekly.set(mk,row); render();
  try{ const r=await db.from('weekly_status').upsert(row,{onConflict:'week_start,key'}).select().single(); if(r.error) throw r.error; S.weekly.set(mk,r.data); }
  catch(e){ if(prev) S.weekly.set(mk,prev); else S.weekly.delete(mk); fail(e); }
}
async function toggleShop(id){ const it=S.shop.find(x=>sid(x.id)===id); if(!it) return; it.bought=!it.bought; render();
  const r=await db.from('shopping_items').update({bought:it.bought}).eq('id',it.id); if(r.error){it.bought=!it.bought;fail(r.error);} }
async function addShop(){ const text=document.getElementById('shopText').value.trim(); if(!text) return;
  const quantity=document.getElementById('shopQty').value.trim()||'1×'; const category=document.getElementById('shopCat').value;
  const r=await db.from('shopping_items').insert({text,quantity,category,bought:false,added_by:KID||S.user||'?'}).select().single();
  if(r.error) return fail(r.error); S.shop.push(r.data); S._shopCat=category; render(); setTimeout(()=>document.getElementById('shopText')?.focus(),0); }
async function clearBought(){ const ids=S.shop.filter(x=>x.bought).map(x=>x.id); if(!ids.length) return;
  const r=await db.from('shopping_items').delete().in('id',ids); if(r.error) return fail(r.error); S.shop=S.shop.filter(x=>!x.bought); render(); }
function fail(e){ console.error(e); toast('Speichern fehlgeschlagen: '+(e.message||e)); render(); }
let tt; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2600); }

// ═══ Rendering ═══════════════════════════════════════════════════
function render(){
  const d=today(); const D=parse(d);
  document.getElementById('dateline').textContent=D.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const main=document.getElementById('main');
  if(KID) return renderKid(main);
  document.getElementById('person').innerHTML=['E','B'].map(u=>`<button class="${S.user===u?'on':''}" onclick="setUser('${u}')">${u}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  let h=S.err?`<div class="err">Fehler beim Laden: ${esc(S.err)}</div>`:'';
  if(!S.loaded){ main.innerHTML=h||'<div class="empty">Lade …</div>'; return; }
  if(S.view==='heute') h+=renderHeute();
  else if(S.view==='woche') h+=renderWoche();
  else if(S.view==='treffen') h+=renderTreffen();
  else h+=renderEinkauf();
  main.innerHTML=h;
}
function listSeg(cur,fn){
  return `<div class="seg listseg">${[['haushalt','🏠 Haushalt'],['kinder','🧒 Kinder'],['abend','🌙 Abend']].map(([k,l])=>
    `<button class="${k} ${cur===k?'on':''}" onclick="${fn}('${k}')">${l}${k==='haushalt'&&cur!=='haushalt'&&S.user==='B'&&S.view==='heute'&&dueItems().length?' <span class="dot-red"></span>':''}</button>`).join('')}</div>`;
}
function progress(done,total,color){
  const pct=total?Math.round(done/total*100):0;
  return `<div class="progress"><strong>${done}</strong> von ${total} erledigt</div><div class="pbar"><div style="width:${pct}%;background:${color}"></div></div>`;
}
function taskRows(tasks){
  const d=cur();
  if(!tasks.length) return '<div class="empty">Keine Aufgaben</div>';
  return tasks.map(t=>{ const c=comp(t.id,d); const st=c?c.status:'';
    const sym=st==='done'?'✓':st==='skip'?'⊘':'';
    const badge=st==='done'?`<span class="badge ${esc(c.done_by)}">${esc(c.done_by)}</span>`:st==='skip'?'<span class="badge">nicht nötig</span>':'';
    return `<div class="row ${st}" onclick="cycleTask('${sid(t.id)}')"><div class="chk">${sym}</div><div class="txt">${esc(t.text)}</div>${badge}</div>`;}).join('');
}

function renderHeute(){
  const d=cur(); let h=listSeg(S.list,'setList')+dayNav();
  if(S.list==='haushalt'){
    const tasks=byList('haushalt').filter(t=>onDay(t,d));
    const hc=byList('handycheck');
    const all=[...hc,...tasks]; const done=all.filter(t=>comp(t.id,d)?.status==='done').length;
    const rel=all.filter(t=>comp(t.id,d)?.status!=='skip').length;
    h+=progress(done,rel,'var(--blue)');
    const due=(S.user==='B'&&d===today())?dueItems():[];
    if(due.length) h+=renderDue(due);
    if(hc.length){
      h+=`<div class="label">Morgens</div><div class="card hc"><div class="hc-q">📵 Handys über Nacht draußen?</div><div class="chips">`+
        hc.map(t=>{const c=comp(t.id,d);const st=c?c.status:'';
          const lab=`${t.child_name}${KIDS.includes(t.child_name)&&hc.filter(x=>x.child_name===t.child_name).length>1?' · '+t.text:''}`;
          return `<div class="chip ${st}" onclick="cycleTask('${sid(t.id)}')" style="${st==='done'?'':'border-left:4px solid '+KCOL[t.child_name]}"><span class="dot">${st==='done'?'✓':st==='skip'?'⊘':''}</span>${esc(lab)}${st==='done'?` <span class="badge ${esc(c.done_by)}">${esc(c.done_by)}</span>`:''}</div>`;}).join('')+`</div></div>`;
    }
    h+=`<div class="label">Aufgaben heute</div><div class="card">${taskRows(tasks)}</div>`;
    h+=renderWochenstatus(due.filter(x=>x.wk===monday(today())).map(x=>x.key));
  } else if(S.list==='abend'){
    const tasks=byList('abend').filter(t=>onDay(t,d));
    h+=progress(tasks.filter(t=>comp(t.id,d)?.status==='done').length,tasks.filter(t=>comp(t.id,d)?.status!=='skip').length,'var(--purple)');
    h+=`<div class="label">Aufgaben heute</div><div class="card">${taskRows(tasks)}</div>`;
  } else h+=renderKinderHeute();
  return h;
}

// ═══ Wochenstatus & Logbuch ══════════════════════════════════════
const LOGK={hausfreitag:'🔧 Haus-Freitag',finanz:'💶 Finanz-Termin',rasen:'🌱 Rasenmähen'};
const logOf=(k,d)=>S.log.find(e=>e.key===k&&e.date===d);
const logsOf=k=>S.log.filter(e=>e.key===k).sort((a,b)=>b.date.localeCompare(a.date));
const wsOf=(k,wk)=>S.weekly.get(`${wk}|${k}`)||{};
const wkDay=(d,n)=>addDays(monday(d),n);   // 0=Mo … 6=So
const tagsHtml=t=>(t||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
const logLine=e=>`<div class="logitem"><b>${WD[dow(e.date)]} ${dm(e.date)}</b> · ${esc(e.status||'')}${e.text?': ':''}${esc(e.text||'')} <button class="lnk" onclick="S.day='${e.date}';S.logOpen='${e.key}';render();setTimeout(()=>document.getElementById('log-${e.key}')?.focus(),0)">ändern</button></div>`;

// Erinnerungen: nur für B, nur in der Heute-Ansicht
function dueItems(){
  const t=today(), min=addDays(t,-MAXBACK), out=[];
  for(const wk of [monday(addDays(t,-7)),monday(t)]){
    const fi=wsOf('finanz',wk), fd=wkDay(wk,1);
    if(!fi.status&&fd<=t&&fd>=min) out.push({key:'finanz',date:fd,wk});
    const hf=wsOf('hausfreitag',wk); let hd=wkDay(wk,4); let open=hf.status!=='erledigt';
    if(hf.status==='verschoben'){ if(hf.moved_to) hd=hf.moved_to; else open=false; }
    if(open&&hd<=t&&hd>=min) out.push({key:'hausfreitag',date:hd,wk});
  }
  for(const r of byList('intervall')){ const {due}=intervalInfo(r);
    if(due<=t&&comp(r.id,t)?.status!=='done'&&!logOf('rasen',t)) out.push({key:'rasen',date:due,wk:monday(t),task:r}); }
  return out;
}
function renderDue(items){
  const t=today(); let h=`<div class="label" style="color:var(--orange)">⏰ Fällig</div><div class="card">`;
  for(const it of items){
    const late=it.date<t; const when=late?`offen seit ${WD[dow(it.date)]} ${dm(it.date)}`:'heute fällig';
    if(it.wk===monday(t)){
      const body=it.key==='finanz'?cardFin():it.key==='hausfreitag'?cardHaus():cardRasen(it.task);
      h+=body.replace('class="ws"',`class="ws ${late?'late-hl':'due-hl'}"`).replace('<!--WHEN-->',`<span class="${late?'overdue':'due'}"> · ${when}</span>`);
    } else {
      const jump=it.key==='finanz'?wkDay(it.wk,1):wkDay(it.wk,4);
      h+=`<div class="ws late-hl"><div class="ws-head"><div><div class="ws-title">${LOGK[it.key]}</div><div class="ws-sub overdue">${when} (Vorwoche)</div></div>
          <button class="btn small" onclick="S.day='${jump}';render();window.scrollTo(0,0)">eintragen →</button></div></div>`;
    }
  }
  return h+`</div>`;
}
function renderWochenstatus(skip=[]){
  const parts=[];
  if(!skip.includes('hausfreitag')) parts.push(cardHaus());
  if(!skip.includes('finanz')) parts.push(cardFin());
  if(!skip.includes('rasen')) for(const t of byList('intervall')) parts.push(cardRasen(t));
  if(!parts.length) return '';
  return `<div class="label">${monday(cur())===monday(today())?'Diese Woche':'Woche ab '+dm(monday(cur()))}</div><div class="card">${parts.join('')}</div>`;
}
function cardHaus(){
  const hf=wsOf('hausfreitag',monday(cur()));
  const ls=hf.status==='erledigt'?'erledigt':hf.status==='verschoben'?'verschoben':null;
  return `<div class="ws"><div class="ws-head"><div><div class="ws-title">🔧 Haus-Freitag<!--WHEN--></div>
     <div class="ws-sub">${hf.status?`${esc(hf.status)}${hf.status==='verschoben'&&hf.moved_to?' auf '+dm(hf.moved_to):''}`:'noch offen'}</div></div>
     <div class="pills">${[['geplant',''],['erledigt','good'],['verschoben','warn']].map(([s,c])=>`<button class="${hf.status===s?'on '+c:''}" onclick="setHF('${s}')">${s}</button>`).join('')}</div></div>
     <div class="ws-extra">
       ${hf.status==='verschoben'?`<label class="ws-sub">Verschoben auf <input class="inp" type="date" value="${esc(hf.moved_to||'')}" onchange="setWeekly('hausfreitag',{moved_to:this.value||null})"></label>`:''}
       <input class="inp" placeholder="Plan: Stichworte, mit Komma getrennt (max. 5)" value="${esc(hf.note||'')}" onchange="setTags(this.value)">
       ${hf.note?`<div class="tags"><span class="ws-sub">Plan:</span>${tagsHtml(hf.note)}</div>`:''}
     </div>${logArea('hausfreitag',ls)}</div>`;
}
function cardFin(){
  const fi=wsOf('finanz',monday(cur()));
  const st=fi.status==='ja'?'erledigt':fi.status==='nein'?'nicht erledigt':null;
  const ls=st||'Notiz';   // Eintrag im Logbuch ist immer möglich – auch bei offen/erledigt
  return `<div class="ws"><div class="ws-head"><div><div class="ws-title">💶 Finanz-Termin <span class="ws-sub">(Di)</span><!--WHEN--></div>
     <div class="ws-sub">${st||'noch offen'}</div></div>
     <div class="pills">${[['ja','good','erledigt'],['nein','bad','nicht erledigt']].map(([s,c,l])=>`<button class="${fi.status===s?'on '+c:''}" onclick="setFI('${s}')">${l}</button>`).join('')}</div></div>
     ${logArea('finanz',ls)}</div>`;
}
function cardRasen(t){
  const {last,due}=intervalInfo(t); const d=cur(); const isT=d===today();
  const done=comp(t.id,d)?.status==='done'; const not=logOf('rasen',d)?.status==='nicht erledigt';
  const st=done?`${isT?'heute':'am '+dm(d)} erledigt ✓ · nächstes Mal ab ${dm(due)}`:
    due<=d?`fällig ab ${dm(due)}${last?' · zuletzt '+dm(last):''}`:`nächstes Mal ab ${dm(due)}${last?' · zuletzt '+dm(last):''}`;
  return `<div class="ws"><div class="ws-head"><div><div class="ws-title">🌱 ${esc(t.text)}<!--WHEN--></div><div class="ws-sub">${st}</div></div>
     <div class="pills"><button class="${done?'on good':''}" onclick="toggleInterval('${sid(t.id)}')">erledigt</button>
       <button class="${not?'on bad':''}" onclick="rasenNot('${sid(t.id)}')">${isT?'heute nicht':'nicht'}</button></div></div>
     ${logArea('rasen',done?'erledigt':not?'nicht erledigt':null)}</div>`;
}
const LOG_PH={Notiz:'Notiz, Stichworte mit Komma',erledigt:'Was gemacht? Stichworte, mit Komma',verschoben:'Warum verschoben?','nicht erledigt':'Warum nicht?'};
function logArea(k,status){
  const d=cur(); const e=logOf(k,d); let h='';
  if(S.logOpen===k&&(status||e)){
    const cur0=e?.status||status;
    if(k==='finanz') h+=`<div class="addrow"><select class="inp" id="logst-${k}">${['erledigt','nicht erledigt','Notiz'].map(o=>`<option${o===cur0?' selected':''}>${o}</option>`).join('')}</select></div>`;
    h+=`<div class="addrow"><input class="inp" id="log-${k}" placeholder="${LOG_PH[cur0]||'Notiz'}" value="${esc(e?.text||'')}" onkeydown="if(event.key==='Enter')saveLog('${k}','${status}')">
        <button class="btn primary" onclick="saveLog('${k}','${status}')">Speichern</button><button class="btn" onclick="S.logOpen=null;render()">✕</button></div>`;
  } else if(e){
    h+=`<div class="logline">📝 <span class="ws-sub">${esc(e.status||'')}</span> ${tagsHtml(e.text)}
        <button class="lnk" onclick="openLog('${k}')">ändern</button><button class="lnk" onclick="delLog('${k}')">löschen</button></div>`;
  } else if(status){
    h+=`<div><button class="lnk" onclick="openLog('${k}')">📝 ${status==='erledigt'?'Was gemacht? eintragen':status==='Notiz'?'Notiz eintragen':'Begründung eintragen'}</button></div>`;
  }
  const hist=logsOf(k).filter(x=>x.date!==d);
  if(hist.length){
    const l=hist[0];
    h+=`<div class="ws-sub">zuletzt ${WD[dow(l.date)]} ${dm(l.date)} · ${esc(l.status||'')}${l.text?': '+esc(l.text):''}
        <button class="lnk" onclick="S.logExp['${k}']=!S.logExp['${k}'];render()">Logbuch ${S.logExp[k]?'▴':'›'}</button></div>`;
    if(S.logExp[k]) h+=`<div class="loglist">${hist.slice(0,12).map(logLine).join('')}</div>`;
  }
  return h?`<div class="ws-extra">${h}</div>`:'';
}
function openLog(k){ S.logOpen=k; render(); setTimeout(()=>document.getElementById('log-'+k)?.focus(),0); }
async function saveLog(k,status,force){
  const el=document.getElementById('log-'+k);
  const text=(force!==undefined?force:(el?el.value:'')).split(',').map(x=>x.trim()).filter(Boolean).join(', ');
  const d=cur();
  const sel=document.getElementById('logst-'+k); if(sel&&sel.value) status=sel.value;
  try{
    const r1=await db.from('log_entries').delete().eq('key',k).eq('date',d); if(r1.error) throw r1.error;
    const r=await db.from('log_entries').insert({key:k,date:d,status,text}).select().single(); if(r.error) throw r.error;
    S.log=S.log.filter(e=>!(e.key===k&&e.date===d)); S.log.push(r.data); S.logOpen=null; render();
  }catch(e){ fail(e); }
}
async function delLog(k){ const d=cur();
  const r=await db.from('log_entries').delete().eq('key',k).eq('date',d); if(r.error) return fail(r.error);
  S.log=S.log.filter(e=>!(e.key===k&&e.date===d)); render(); }
function setHF(s){ const wk=monday(cur()); const w=wsOf('hausfreitag',wk); const nv=w.status===s?null:s;
  setWeekly('hausfreitag',{status:nv, moved_to:s==='verschoben'?(w.moved_to||null):null});
  if(nv==='erledigt'||nv==='verschoben') openLog('hausfreitag'); }
function setFI(s){ const wk=monday(cur()); const w=wsOf('finanz',wk); const nv=w.status===s?null:s;
  setWeekly('finanz',{status:nv}); if(nv) openLog('finanz'); }
function setTags(v){ const t=v.split(',').map(s=>s.trim()).filter(Boolean); if(t.length>5) toast('Nur die ersten 5 Stichworte werden gespeichert'); setWeekly('hausfreitag',{note:t.slice(0,5).join(', ')}); }
function toggleInterval(id){ if(needUser()) return; const d=cur(); const on=comp(id,d)?.status==='done';
  setComp(id,d,on?null:'done');
  if(!on){ if(logOf('rasen',d)?.status==='nicht erledigt') delLog('rasen'); openLog('rasen'); } }
async function rasenNot(id){ if(needUser()) return; const d=cur();
  if(logOf('rasen',d)?.status==='nicht erledigt') return delLog('rasen');
  if(comp(id,d)?.status==='done') await setComp(id,d,null);
  await saveLog('rasen','nicht erledigt',''); openLog('rasen'); }

function kidRow(t,child,d){
  const s=kstate(t,d,child);
  const sym={done:'✓',fail:'✗',skip:'⊘'}[s.p]||'';
  const sub=kidSub(t,d,child,false);
  return `<div class="krow ${s.cls}"><span class="kmark ${s.k?'on':''}" title="vom Kind abgehakt">${s.k?'✓':''}</span>
    <span class="ktxt">${esc(t.text)}${sub}</span>
    <button class="pmark ${s.p||''}" title="Kontrolle E/B" onclick="cycleVerify('${sid(t.id)}','${child}')">${sym}</button></div>`;
}
function renderKinderHeute(){
  const d=cur(); let done=0,total=0;
  for(const c of KIDS) for(const [sec] of KSECTIONS) for(const t of kidTasks(c,d,sec)){const s=kstate(t,d,c); if(s.eff!==null){total++; if(s.eff) done++;}}
  let h=progress(done,total,'var(--green)');
  h+=`<div class="legend"><span><i class="lg" style="background:#34C75999;border-color:transparent;border-radius:3px"></i>Kind</span>
      <span><i class="lg" style="background:var(--green);border-color:var(--green)"></i>kontrolliert</span>
      <span><i class="lg" style="background:var(--red);border-color:var(--red)"></i>nicht erledigt</span>
      <span><i class="lg" style="border-color:#007AFF88"></i>⊘ nicht nötig</span></div>`;
  h+=`<div class="seg kidpick">${KIDS.map(k=>`<button class="${S.mKid===k?'on':''}" style="${S.mKid===k?'color:'+KCOL[k]:''}" onclick="setMKid('${k}')">${k}</button>`).join('')}</div>`;
  const fut=d>today();
  for(const [sec,lab] of KSECTIONS){
    if(sec==='sonder'&&!KIDS.some(c=>kidTasks(c,d,sec).length)) continue;
    h+=`<div class="label" ${sec==='sonder'?'style="color:var(--orange)"':''}>${lab}</div><div class="kgrid">`;
    for(const c of KIDS){
      const ts=kidTasks(c,d,sec); const sts=ts.map(t=>kstate(t,d,c));
      const kd=sts.filter(s=>s.k).length; const ok=sts.filter(s=>s.p==='done').length; const pend=sts.filter(s=>s.cls==='pending').length;
      h+=`<div class="kcol ${S.mKid===c?'sel':''}"><div class="khead" style="border-color:${KCOL[c]}">
          <span><span class="kname" style="color:${KCOL[c]}">${c}</span><span class="kcount">Kind ${kd}/${ts.length} · ✓ ${ok}</span></span>
          ${pend&&!fut?`<button class="btn small green" onclick="verifyAll('${c}','${sec}')">✓ alle (${pend})</button>`:''}</div>
          ${ts.length?ts.map(t=>kidRow(t,c,d)).join(''):'<div class="empty">–</div>'}</div>`;
    }
    h+=`</div>`;
  }
  h+=renderOnce();
  return h;
}

// ── Einzelaufgaben ──
function renderOnce(){
  const from=addDays(today(),-MAXBACK);
  let h=`<div class="label">Sonderaufgaben planen</div><div class="kgrid">`;
  for(const c of KIDS){
    const list=byList('kinder2').filter(t=>t.kind==='once'&&t.child_name===c&&(t.next_due_date>=from||onDay(t,today())))
      .sort((a,b)=>a.next_due_date.localeCompare(b.next_due_date));
    const def=S.oForm.kid===c&&S.oForm.date?S.oForm.date:cur();
    h+=`<div class="kcol ${S.mKid===c?'sel':''}"><div class="khead" style="border-color:${KCOL[c]}"><span class="kname" style="color:${KCOL[c]}">${c}</span></div>`+
      list.map(t=>{ const due=t.next_due_date, t0=today();
        const open=due<=t0&&onDay(t,t0)&&!doneOn(t,t0);
        const st=due>t0?'geplant':open?(due<t0?'offen, wird übertragen':'heute offen'):'erledigt ✓';
        return `<div class="krow"><span class="ktxt"><span class="ksub" style="color:${open&&due<t0?'var(--red)':due>t0?'var(--orange)':'var(--text-2)'}">${WD[dow(due)]} ${dm(due)} · ${st}</span>${esc(t.text)}</span>
          <button class="btn small" title="löschen" onclick="delOnce('${sid(t.id)}')">✕</button></div>`;}).join('')+
      `<div class="ws-extra" style="padding:8px 10px 10px;margin:0">
         <input class="inp" id="once-text-${c}" placeholder="Neue Aufgabe für ${c} …" onkeydown="if(event.key==='Enter')addOnce('${c}')">
         <div class="addrow"><input class="inp" type="date" id="once-date-${c}" value="${def}" min="${from}">
         <button class="btn primary" onclick="addOnce('${c}')">+</button></div></div></div>`;
  }
  return h+`</div>`;
}
let onceBusy=false;
async function addOnce(c){ if(needUser()||onceBusy) return;
  const text=document.getElementById('once-text-'+c).value.trim(); if(!text) return toast('Bitte einen Text eingeben');
  const dup=S.tasks.find(t=>t.kind==='once'&&t.child_name===c&&t.text.toLowerCase()===text.toLowerCase()&&t.next_due_date===document.getElementById('once-date-'+c).value);
  if(dup) return toast('Diese Sonderaufgabe gibt es für diesen Tag schon');
  onceBusy=true; try{ await addOnceInner(c,text); } finally { onceBusy=false; } }
async function addOnceInner(c,text){
  const date=document.getElementById('once-date-'+c).value; const section='morgen';
  if(!date) return toast('Bitte ein Datum wählen');
  if(date<addDays(today(),-MAXBACK)) return toast('Höchstens 7 Tage zurück');
  const row={text,list_name:'kinder2',child_name:c,section,kind:'once',next_due_date:date,sort_order:100,active:true};
  const r=await db.from('tasks').insert(row).select().single(); if(r.error) return fail(r.error);
  S.tasks.push(r.data); S.oForm={kid:c,date,section};
  toast(`„${text}" für ${c} am ${WD[dow(date)]} ${dm(date)} eingetragen`); render();
  setTimeout(()=>document.getElementById('once-text-'+c)?.focus(),0);
}
async function delOnce(id){ if(needUser()) return;
  const t=S.tasks.find(x=>sid(x.id)===id); if(!t) return;
  if(!confirm(`„${t.text}" (${dm(t.next_due_date)}) löschen?`)) return;
  let r=await db.from('tasks').update({active:false}).eq('id',t.id);
  if(r.error) r=await db.from('tasks').delete().eq('id',t.id);
  if(r.error) return fail(r.error);
  S.tasks=S.tasks.filter(x=>x!==t); render();
}

// ── Tag wählen (Eltern) ──
const maxDay=()=>S.list==='kinder'?addDays(today(),MAXFWD):today();
function dayNav(){
  const d=cur(), t=today(), min=addDays(t,-MAXBACK), max=maxDay();
  const lab=d===t?'Heute':d===addDays(t,-1)?'Gestern':d===addDays(t,1)?'Morgen':'';
  const full=parse(d).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'});
  const cls=d===t?'':d<t?'past':'future';
  const hint=d<t?'nachträglich bearbeiten':d>t?'Vorschau':'';
  return `<div class="daynav ${cls}">
    <button class="btn" onclick="moveDay(-1)" ${d<=min?'disabled':''}>←</button>
    <span class="t">${lab?lab+' · ':''}${full}${hint?` <span class="hint">– ${hint}</span>`:''}</span>
    <span>${d===t?'':'<button class="btn" onclick="moveDay(0)">Heute</button> '}<button class="btn" onclick="moveDay(1)" ${d>=max?'disabled':''}>→</button></span></div>`;
}
function moveDay(n){ const t=today(); let d=n?addDays(S.day,n):t;
  if(d>maxDay()) d=maxDay(); if(d<addDays(t,-MAXBACK)) d=addDays(t,-MAXBACK);
  S.day=d; render(); window.scrollTo(0,0); }

// ── Woche ──
function weekDays(){ return Array.from({length:7},(_,i)=>addDays(S.wkStart,i)); }
function wkHeader(days){ return `<tr><th></th>${days.map(x=>`<th class="${x===today()?'today':''}">${WD[dow(x)]}<br>${dm(x)}</th>`).join('')}</tr>`; }
function cellSimple(t,x){
  if(!onDay(t,x)) return '<span class="c na">–</span>';
  const c=comp(t.id,x);
  if(c?.status==='done') return `<span class="c ${esc(c.done_by)}">${esc(c.done_by||'✓')}</span>`;
  if(c?.status==='skip') return '<span class="c skip">⊘</span>';
  return x>today()?'<span class="c fut"></span>':'<span class="c"></span>';
}
function cellKid(t,x,child){
  if(!onDay(t,x)) return '<span class="c na">–</span>';
  if(t.kind==='rotation'&&(rotDoer(t,x)||rotAssignee(t,x))!==child) return '<span class="c na">–</span>';
  const s=kstate(t,x,child);
  if(s.cls==='ok') return '<span class="c ok">✓</span>';
  if(s.cls==='fail') return '<span class="c fail">✗</span>';
  if(s.cls==='skip') return '<span class="c skip">⊘</span>';
  if(s.cls==='pending') return '<span class="c kid">K</span>';
  return x>today()?'<span class="c fut"></span>':'<span class="c"></span>';
}
function renderWoche(){
  const days=weekDays(); const end=days[6];
  let h=listSeg(S.wkList,'setWkList');
  h+=`<div class="wk-nav"><button class="btn" onclick="moveWeek(-7)">←</button><span class="t">${dm(days[0])} – ${dm(end)}${parse(end).getFullYear()}</span>
      <span><button class="btn" onclick="moveWeek(0)">Heute</button> <button class="btn" onclick="moveWeek(7)">→</button></span></div>`;
  if(S.wkList==='kinder'){
    h+=`<div class="seg">${KIDS.map(k=>`<button class="${S.wkKid===k?'on':''}" style="${S.wkKid===k?'color:'+KCOL[k]:''}" onclick="setWkKid('${k}')">${k}</button>`).join('')}</div>`;
    h+=`<div class="legend"><span><i class="c kid" style="width:16px;height:16px">K</i>nur Kind</span><span><i class="c ok" style="width:16px;height:16px">✓</i>kontrolliert</span><span><i class="c fail" style="width:16px;height:16px">✗</i>nicht erledigt</span><span>⊘ nicht nötig</span></div>`;
    let rows='';
    for(const [sec,lab] of SECTIONS){
      const ts=byList('kinder2').filter(t=>t.section===sec&&(t.kind==='rotation'?(t.rotation||[]).includes(S.wkKid):t.child_name===S.wkKid)&&(t.kind!=='once'||days.some(x=>onDay(t,x))));
      if(!ts.length) continue;
      rows+=`<tr class="sec"><td colspan="8">${lab}</td></tr>`;
      rows+=ts.map(t=>`<tr><td class="name">${esc(t.text)}${t.kind==='once'?` <span class="ksub" style="display:inline">einmalig</span>`:''}${t.kind==='weekly'?` <span class="ksub" style="display:inline">${weekCount(t,end<today()?end:today(),S.wkKid)}/${t.weekly_target}</span>`:''}</td>${days.map(x=>`<td>${cellKid(t,x,S.wkKid)}</td>`).join('')}</tr>`).join('');
    }
    h+=`<div class="card tscroll" style="margin-top:8px"><table class="wk">${wkHeader(days)}${rows}</table></div>`;
  } else {
    if(S.wkList==='haushalt'){
      const hf=S.weekly.get(`${S.wkStart}|hausfreitag`)||{}; const fi=S.weekly.get(`${S.wkStart}|finanz`)||{};
      h+=`<div class="card wsum"><span><b>Haus-Freitag:</b> ${esc(hf.status||'–')}${hf.status==='verschoben'&&hf.moved_to?' auf '+dm(hf.moved_to):''}${hf.note?' · '+esc(hf.note):''}</span>
          <span><b>Finanz-Termin:</b> ${fi.status==='ja'?'erledigt':fi.status==='nein'?'nicht erledigt':'–'}</span></div>`;
    }
    const pre=S.wkList==='haushalt'?byList('handycheck'):[];
    const ts=byList(S.wkList);
    let rows='';
    if(pre.length) rows+=`<tr class="sec"><td colspan="8">Handys über Nacht draußen</td></tr>`+pre.map(t=>`<tr><td class="name">${esc(t.child_name)} · ${esc(t.text)}</td>${days.map(x=>`<td>${cellSimple(t,x)}</td>`).join('')}</tr>`).join('')+`<tr class="sec"><td colspan="8">Aufgaben</td></tr>`;
    rows+=ts.map(t=>`<tr><td class="name">${esc(t.text)}</td>${days.map(x=>`<td>${cellSimple(t,x)}</td>`).join('')}</tr>`).join('');
    h+=`<div class="legend"><span><i class="c E" style="width:16px;height:16px">E</i>E erledigt</span><span><i class="c B" style="width:16px;height:16px">B</i>B erledigt</span><span>⊘ nicht nötig</span><span>– nicht an diesem Tag</span></div>`;
    h+=`<div class="card tscroll" style="margin-top:8px"><table class="wk">${wkHeader(days)}${rows}</table></div>`;
    if(S.wkList==='haushalt'){
      const wl=S.log.filter(e=>e.key!=='treffen'&&e.date>=days[0]&&e.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
      h+=`<div class="label">Logbuch dieser Woche</div><div class="card" style="padding:6px 14px">${wl.length?wl.map(e=>`<div class="logitem"><b>${WD[dow(e.date)]} ${dm(e.date)}</b> · ${LOGK[e.key]||esc(e.key)} · ${esc(e.status||'')}${e.text?': ':''}${esc(e.text||'')}</div>`).join(''):'<div class="empty">Keine Einträge</div>'}</div>`;
    }
  }
  return h;
}

// ── Einkauf ──
// ── Planungstreffen E & B ──
function renderTreffen(){
  const list=S.log.filter(e=>e.key==='treffen').sort((a,b)=>b.date.localeCompare(a.date));
  const q=(S.mtQ||'').toLowerCase();
  const shown=q?list.filter(e=>(e.text||'').toLowerCase().includes(q)):list;
  const ed=S.mtEdit?list.find(e=>e.date===S.mtEdit):null;
  let h=`<div class="label">${ed?'Treffen bearbeiten':'Neues Planungstreffen'}</div>
    <div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px">
      <input class="inp" type="date" id="mtDate" value="${esc(S.mtDate||ed?.date||today())}" onchange="S.mtDate=this.value" ${ed?'disabled':''}>
      <textarea class="inp" id="mtText" rows="8" placeholder="Ergebnisse hier einfügen …" oninput="S.mtDraft=this.value">${esc(S.mtDraft??ed?.text??'')}</textarea>
      <div class="addrow"><button class="btn primary" onclick="saveTreffen()">Speichern</button>
        ${ed||S.mtDraft?'<button class="btn" onclick="cancelTreffen()">Abbrechen</button>':''}</div>
    </div>`;
  h+=`<div class="label">Bisherige Treffen (${list.length})</div>`;
  if(list.length>3) h+=`<input class="inp" placeholder="Suchen …" value="${esc(S.mtQ||'')}" oninput="S.mtQ=this.value;render();const i=document.getElementById('mtSearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)" id="mtSearch" style="margin-bottom:8px">`;
  h+=shown.length?shown.map(e=>`<div class="card mt-item"><div class="mt-head"><b>${parse(e.date).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}</b>
      <span><button class="lnk" onclick="editTreffen('${e.date}')">bearbeiten</button><button class="lnk" onclick="delTreffen('${e.date}')">löschen</button></span></div>
      <div class="mt-text">${esc(e.text||'')}</div></div>`).join(''):'<div class="empty">Noch keine Einträge</div>';
  return h;
}
async function saveTreffen(){
  const date=document.getElementById('mtDate').value; const text=document.getElementById('mtText').value.trim();
  if(!date) return toast('Bitte ein Datum wählen'); if(!text) return toast('Bitte Ergebnisse einfügen');
  if(!S.mtEdit&&S.log.some(e=>e.key==='treffen'&&e.date===date)&&!confirm('Für diesen Tag gibt es schon ein Treffen. Ersetzen?')) return;
  try{
    const r1=await db.from('log_entries').delete().eq('key','treffen').eq('date',date); if(r1.error) throw r1.error;
    const r=await db.from('log_entries').insert({key:'treffen',date,status:null,text}).select().single(); if(r.error) throw r.error;
    S.log=S.log.filter(e=>!(e.key==='treffen'&&e.date===date)); S.log.push(r.data);
    S.mtDraft=null; S.mtEdit=null; S.mtDate=null; toast('Gespeichert'); render();
  }catch(e){ fail(e); }
}
function editTreffen(d){ S.mtEdit=d; S.mtDraft=null; S.mtDate=null; render(); window.scrollTo(0,0); }
function cancelTreffen(){ S.mtEdit=null; S.mtDraft=null; S.mtDate=null; render(); }
async function delTreffen(d){ if(!confirm(`Treffen vom ${dm(d)} löschen?`)) return;
  const r=await db.from('log_entries').delete().eq('key','treffen').eq('date',d); if(r.error) return fail(r.error);
  S.log=S.log.filter(e=>!(e.key==='treffen'&&e.date===d)); render(); }

function renderEinkauf(){
  let h='';
  const cats=[...new Set([...CATS,...S.shop.map(x=>x.category||'Sonstiges')])];
  for(const c of cats){ const it=S.shop.filter(x=>(x.category||'Sonstiges')===c); if(!it.length) continue;
    h+=`<div class="label">${esc(c)}</div><div class="items cat">${it.map(x=>`<div class="item ${x.bought?'bought':''}" onclick="toggleShop('${sid(x.id)}')"><span class="q">${esc(x.quantity||'1×')}</span>${esc(x.text)}</div>`).join('')}</div>`; }
  if(!S.shop.length) h+='<div class="empty">Einkaufsliste ist leer</div>';
  const nb=S.shop.filter(x=>x.bought).length;
  h+=`<div class="label">Artikel hinzufügen ${nb?`<button class="btn small" onclick="clearBought()">${nb} Gekaufte entfernen</button>`:''}</div>
     <div class="addform"><select id="shopQty" class="inp">${Array.from({length:10},(_,i)=>`<option>${i+1}×</option>`).join('')}</select><select id="shopCat" class="inp">${CATS.map(c=>`<option ${c===(S._shopCat||'Lebensmittel')?'selected':''}>${c}</option>`).join('')}</select>
     <div class="addrow full"><input id="shopText" class="inp" placeholder="Artikel …" onkeydown="if(event.key==='Enter')addShop()"><button class="btn primary" onclick="addShop()">Hinzufügen</button></div></div>
     <div class="ws-sub" style="padding:8px 4px">Antippen markiert als gekauft.</div>`;
  return h;
}

// ── Kind-Modus ──
function renderKid(main){
  const c=KID; const d=today();
  document.body.classList.add('kidmode'); document.body.style.setProperty('--kc',KHEX[c]);
  document.getElementById('person').style.display='none';
  const nav=document.getElementById('nav');
  nav.querySelector('[data-view=woche]').style.display='none';
  nav.querySelector('[data-view=treffen]').style.display='none';
  nav.querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b.dataset.view===S.view);
    if(b.dataset.view==='heute') b.innerHTML='<span class="i">✅</span>Aufgaben'; });
  document.getElementById('title').innerHTML=`<span style="color:${KCOL[c]}">${c}</span>`;
  if(!S.loaded){ main.innerHTML=S.err?`<div class="err">${esc(S.err)}</div>`:'<div class="empty">Lade …</div>'; return; }
  if(S.view==='einkauf'){ main.innerHTML=(S.err?`<div class="err">${esc(S.err)}</div>`:'')+renderEinkauf(); return; }
  let all=0,mine=0,h=S.err?`<div class="err">${esc(S.err)}</div>`:'';
  let body='';
  for(const [sec,lab] of KSECTIONS){
    const ts=kidTasks(c,d,sec); if(!ts.length) continue;
    body+=`<div class="label" ${sec==='sonder'?'style="color:var(--orange)"':''}>${lab}</div><div class="card kid-big ${sec==='sonder'?'sonder':''}">`+ts.map(t=>{
      const s=kstate(t,d,c); all++; if(s.k) mine++;
      const vb=s.p==='done'?'<span class="vbadge done">✓ kontrolliert</span>':s.p==='fail'?'<span class="vbadge fail">nochmal!</span>':s.p==='skip'?'<span class="vbadge skip">nicht nötig</span>':'';
      const sub=kidSub(t,d,c,true);
      return `<div class="krow ${s.k?'mine':''}" onclick="toggleKid('${sid(t.id)}','${c}')"><span class="kmark ${s.k?'on':''}">${s.k?'✓':''}</span><span class="ktxt">${esc(t.text)}${sub}</span>${vb}</div>`;
    }).join('')+`</div>`;
  }
  h+=progress(mine,all,KCOL[c])+body+(all?'':'<div class="empty">Heute keine Aufgaben 🎉</div>');
  main.innerHTML=h;
}

// ═══ UI-Aktionen ═════════════════════════════════════════════════
function setUser(u){ S.user=u; localStorage.setItem('hh_user',u); render(); }
function setList(l){ S.list=l; localStorage.setItem('hh_list',l); if(S.day>maxDay()) S.day=today(); render(); }
function setMKid(k){ S.mKid=k; localStorage.setItem('hh_mkid',k); render(); }
function setWkList(l){ S.wkList=l; render(); }
function setWkKid(k){ S.wkKid=k; render(); }
function moveWeek(n){ S.wkStart=n?addDays(S.wkStart,n):monday(today()); load(); }
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{ S.view=b.dataset.view; if(S.view==='woche') S.wkList=S.list; render(); window.scrollTo(0,0); });

// Aktualisieren: alle 30 s und beim Zurückkehren in die App; Tageswechsel erkennen
let lastDay=today();
function refresh(){ if(document.activeElement&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(today()!==lastDay){ lastDay=today(); S.wkStart=monday(today()); S.day=today(); } load(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
if(!window.__MOCK_DB__) setInterval(()=>{ if(!document.hidden) refresh(); },30000);
load();
</script>
